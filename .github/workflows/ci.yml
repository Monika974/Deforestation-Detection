name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies (TensorFlow test is skipped in CI)
        run: pip install numpy scipy rasterio geopandas shapely pyyaml pytest
      - name: Run tests
        run: PYTHONPATH=src pytest -q
